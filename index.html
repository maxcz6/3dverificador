<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Verificador WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <link rel="stylesheet" href="./css/styles.css?v=3" />
</head>
<body>
  <main id="app">
    <section id="estado-camara" class="estado-camara" role="status" aria-live="polite">
      <strong>Iniciando cámara</strong>
      <span>Apunta la cámara hacia el documento.</span>
    </section>

    <a-scene
      mindar-image="imageTargetSrc: ./targets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item
          id="modelo-instituto"
          src="./assets/SAM_Instituto_Excelencia_AR.glb">
        </a-asset-item>
        <a-asset-item
          id="modelo-programacion"
          src="./assets/sello.glb">
        </a-asset-item>
        <video
          id="video-certificado"
          src="./vdo.mp4"
          loop
          muted
          playsinline
          preload="auto">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-0" mindar-image-target="targetIndex: 0">
        <a-video
          id="video-certificado-overlay"
          src="#video-certificado"
          width="1"
          height="0.694"
          position="0 0 0.01"
          material="shader: flat; side: double; depthWrite: false; repeat: 0.811 1; offset: 0.0945 0">
        </a-video>
        <a-gltf-model
          id="modelo-instituto-overlay"
          src="#modelo-instituto"
          rotation="0 0 0"
          position="-0.62 0.25 0.04"
          scale="0.7 0.7 0.7">
        </a-gltf-model>
        <a-gltf-model
          id="modelo-programacion-overlay"
          src="#modelo-programacion"
          rotation="0 0 0"
          position="0.62 0.25 0.05"
          scale="0.07 0.07 0.07">
        </a-gltf-model>
        <a-entity id="ar-panel" position="-0.2 -0.06 0.04" visible="false">
          <a-plane
            color="#0f172a"
            opacity="0.52"
            width="0.58"
            height="0.5"
            material="transparent: true; depthWrite: false">
          </a-plane>
          <a-text
            id="ar-estado"
            text="value: VERIFICADO; align: left; color: #4ade80; width: 10"
            position="-0.26 0.17 0.01"
            scale="0.055 0.05 0.06">
          </a-text>
          <a-text
            id="ar-titulo"
            text="value: Seminario de Office Avanzado; align: left; color: #ffffff; width: 10"
            position="-0.26 0.095 0.01"
            scale="0.055 0.05 0.06">
          </a-text>
          <a-text
            id="ar-institucion"
            text="value: Institución; align: left; color: #ffffff; width: 10"
            position="-0.26 0.015 0.01"
            scale="0.055 0.05 0.06">
          </a-text>
          <a-text
            id="ar-codigo"
            text="value: Código; align: left; color: #ffffff; width: 10"
            position="-0.26 -0.065 0.01"
            scale="0.055 0.05 0.06">
          </a-text>
          <a-text
            id="ar-detalle"
            text="value: Detalle; align: left; color: #ffffff; width: 10"
            position="-0.26 -0.15 0.01"
            scale="0.055 0.05 0.06">
          </a-text>
        </a-entity>
      </a-entity>
    </a-scene>
  </main>

  <script src="./js/config.js?v=2"></script>
  <script src="./js/app.js?v=5"></script>
</body>
</html>
